[package]
name = "sage-receipts"
version = "0.1.0"
edition = "2021"
description = "Verifier for SAGE outcome receipts (v1): checks a signed receipt byte for byte against the reference and records it as an off-consensus label. Nothing in the node depends on it."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "sage-receipt-verify"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
unicode-normalization = "0.1"
